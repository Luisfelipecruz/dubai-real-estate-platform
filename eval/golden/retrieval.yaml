                                           # digitisation slivers, not shared territory
    decoys:
      docs/polygon-simplification.md: 0    # DISCUSSES OVERLAPS AT LENGTH and is wrong
                                           # here. Its overlaps are an ARTEFACT it
                                           # introduces by simplifying; this question is
                                           # about overlaps present in the source data.
                                           # Same words, opposite cause — which is what a
                                           # decoy is for.

  - id: G-15
