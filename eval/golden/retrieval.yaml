  - id: G-16
    cohort: m16
    text: "Why did the two engines disagree about how many rows the file contained?"
    kind: factual
    relevance:
      docs/pandas-vs-pyspark.md: 3    # four rows carry Hijri dates, years 1416-1422 AH;
