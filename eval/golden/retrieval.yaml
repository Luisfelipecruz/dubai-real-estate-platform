  - id: G-10
    cohort: m13a
    text: "Why is there no LangChain in this repo?"
    kind: factual
    decoys:
      docs/rag-corpus-design.md: 0        # what the dense arm returns instead
    relevance:
      docs/changelog.md: 3                # "No LangChain, no LlamaIndex, no external
                                          # vector database", with the argument. The ONLY
                                          # place in docs/ where the string appears.
    note: >
      The one question whose first-run result was unreadable rather than wrong. All three
      arms returned hybrid-retrieval-plans.md and there was no way to tell whether that
      was retrieval or self-reference.

      GRADE CORRECTED AFTER THE FACT, and the correction is disclosed because it is the
      same mistake in miniature. This file first graded hybrid-retrieval-plans.md a 2,
      "makes the same case from the retrieval side". It does not. `grep -n LangChain
      docs/*.md` returns exactly one line, in changelog.md. The only reason that document
      ever mentioned LangChain was the eval question itself, sitting in the table -- so
      the grade was assigned from what the retriever had returned, which is precisely the
      error the rubric exists to prevent. Removing the question removed the evidence.

  # ═══════════════════════════════════════════════════════════════════════════
  # COHORT m16 — ten questions added 2026-08-30, graded from the documents
  # before any of them was run through `/search`.
  #
  # WHY A COHORT FIELD, AND WHY IT IS NOT BOOKKEEPING
  # ─────────────────────────────────────────────────
  # `8/10 top-1 for dense` is a published number. It is in M-12, in the m13a write-up,
  # in changelog v0.7.0 and in a PR body. Adding ten questions and reporting `16/20`
  # would silently redefine it: a different question set is a different measurement,
  # and whether the new ten are harder or easier than the old ten is unknown until
  # they are run. So every question carries its cohort, `run_eval.py --suite retrieval`
  # reports the two separately as well as together, and the m13a numbers stay
  # comparable with themselves.
  #
  # These ten were chosen for spread, not for pass rate. Two of them (G-13, G-16) are
  # phrased in vocabulary that does NOT appear in the source document, which is the
  # case the dense arm exists to serve and the case no relaxation of the lexical
  # tsquery can reach. One (G-14) has an explicit decoy that discusses the same
  # measurement for a different reason.
  # ═══════════════════════════════════════════════════════════════════════════

  - id: G-11
    cohort: m16
    text: "If the first writer aborts, what happens to the insert that was waiting on it?"
    kind: factual
    relevance:
      docs/concurrent-inserts.md: 3   # "the same race where A rolls back" — B wakes and
                                      # succeeds; block first, decide after
      docs/architecture.md: 1         # names the unique keys, says nothing about the race

  - id: G-12
    cohort: m16
    text: "Do missing values in an auto-increment column mean rows were lost?"
    kind: factual
    relevance:
      docs/concurrent-inserts.md: 3   # nextval never rolls back; gaps are expected, not
                                      # corruption; a surrogate key is an identity, not a
                                      # count
    note: >
      Phrased away from the source's vocabulary on purpose. The document says "sequence",
      "SERIAL" and "gapless"; the question says "auto-increment" and "missing values",
      which is how someone who has just seen the gap would ask. No lexical relaxation
      bridges that — this one is dense or nothing.

  - id: G-13
    cohort: m16
    text: "What breaks if the shapes are made lighter before sending them to a browser?"
    kind: factual
    relevance:
      docs/polygon-simplification.md: 3    # shared edges decimate twice and pull apart;
                                           # 176 of 483 borders migrate touches->overlaps
                                           # at 0.0001, adjacency lost outright by 0.0005
      docs/polygon-adjacency-plans.md: 1   # the DE-9IM counts on the FULL geometry, which
                                           # is the baseline that document is measured
                                           # against, not the finding
    note: >
      The hardest of the new ten by construction. The source never uses "lighter" or
      "browser" in the sentence that answers this — it says "simplification" and
      "PreserveTopology" — so the match has to be semantic. G-16 in the m13a cohort made
      the same point from the other direction with "border" against "boundari".

  - id: G-14
    cohort: m16
    text: "Why do some administrative boundaries in this dataset overlap each other?"
    kind: factual
    relevance:
      docs/polygon-adjacency-plans.md: 3   # 131 overlapping pairs, largest 5,471 m2
