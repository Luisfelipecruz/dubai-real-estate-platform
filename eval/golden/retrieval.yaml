      docs/pandas-vs-pyspark.md: 1    # what the Spark job DOES, not what it writes

  - id: G-20
    cohort: m16
    text: "Why does the platform take file uploads rather than reading from the portal directly?"
    kind: factual
    relevance:
      docs/architecture.md: 3         # no stable public API; scrapers are brittle; mirrors
                                      # how organisations actually receive government data
    note: >
      Deliberately easy, and included for that reason. A set made entirely of hard
      questions cannot distinguish "the retriever is broken" from "these questions are
      hard", and a floor with no easy questions under it is not a floor.
