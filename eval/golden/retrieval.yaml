                                          # WORD from this one, so the isolation test does
                                          # not catch it and the lexical arm went straight
                                          # to it the moment it was indexed. Exactly the
                                          # species m13a documented; now demonstrated by a
                                          # before-and-after rather than argued.
      docs/rag-corpus-design.md: 0        # RESIDUAL, same species as G-01's. Its routing
                                          # table uses "Which communities border Business
