    note: >
      The strongest finding in that document and the one a reader remembers. It is graded
      here because it is a SINGLE-DOCUMENT answer with no competitor, which makes it the
      control against G-13 and G-14: if this one misses, the problem is retrieval in
      general rather than the specific hardness those two were built for.

